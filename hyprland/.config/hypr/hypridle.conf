# hypridle in shell mode: no idle listeners — the shell's Idle service owns
# the timers (dim, lock, screen off, suspend; see quickshell Services/Idle).
# hypridle stays only as the logind bridge: `loginctl lock-session` and the
# pre-sleep hook become a shell lock; the screen comes back after sleep.
general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = ~/.config/hypr/scripts/lock.sh
    # dpms takes a table: a bare string like dpms("on") is ignored and the
    # dispatcher toggles, which turns a woken screen straight back off.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
}
