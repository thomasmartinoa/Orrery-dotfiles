# Cassini — a hued space theme sampled from its wallpaper: a rust-brown
# ringed giant in deep warm-black space, its rings lit ice-teal, a slate
# nebula behind. Surfaces are the space black (a faint warm tint), the accent
# is the ring's ice-teal, copper from the planet's lit edge is the warm
# second colour, and the nebula gives blue and violet.

name = "Cassini"
mode = "dark"
hued = true
bar  = "minimal"    # preferred bar style: minimal | floating | pill (Legacy); yours in Menu › Appearance › Bar wins

[colors]
bg0 = "#110b0b"     # deep space — bar / cards
bg1 = "#181010"
bg2 = "#211717"     # module backgrounds
bg3 = "#362826"     # borders, separators
bg4 = "#4a3632"     # hover

fg            = "#e4ebe8"   # ring-lit white
accent_bright = "#9fd8ce"   # ring ice-teal — active / important
accent_light  = "#b9d6cf"   # primary text; ring ice (borders take it at 24%)
accent_mid    = "#94a29e"   # secondary text
accent_dim    = "#676e6b"   # inactive

active   = "#9fd8ce"
hover    = "#d69a6c"   # copper
warning  = "#e8c07a"
critical = "#d77c64"

grey0 = "#4e403c"
grey1 = "#736662"
grey2 = "#8f8480"

red    = "#d77c64"   # the rust moon
orange = "#d69a6c"   # the planet's lit edge
yellow = "#e8c07a"   # sunlit ring edge
green  = "#9cc9a3"
aqua   = "#8fd3c8"   # the rings
blue   = "#8ea8cc"   # the nebula, brightened
purple = "#a99bc6"   # nebula violet

[terminal]
background = "#110b0b"
foreground = "#e4ebe8"
cursor     = "#9fd8ce"
selection_background = "#33403e"
selection_foreground = "#e4ebe8"
color0  = "#362826"
color1  = "#d77c64"
color2  = "#9cc9a3"
color3  = "#e8c07a"
color4  = "#8ea8cc"
color5  = "#a99bc6"
color6  = "#8fd3c8"
color7  = "#c4ccc9"
color8  = "#5e4e4a"
color9  = "#ef8a77"
color10 = "#b1dab7"
color11 = "#f2d193"
color12 = "#a7bddc"
color13 = "#c0b3da"
color14 = "#a9e3d9"
color15 = "#e4ebe8"

[git]
added    = "#9cc9a3"
modified = "#e8c07a"
deleted  = "#d77c64"
renamed  = "#8ea8cc"
conflict = "#d69a6c"

[apps]
gtk_theme        = "adw-gtk3-dark"
icon_theme       = "Papirus-Dark-darkcyan"
cursor_theme     = "default"
qt_style         = "Adwaita-Dark"
nvim_colorscheme = "aether"
